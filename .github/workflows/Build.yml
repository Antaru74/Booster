name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname 'gamebooster1.zip' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::Gamebooster1.zip tidak ditemukan di root repo"
            exit 1
          fi
          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted
          SETTINGS=$(find extracted -name 'settings.gradle.kts' -not -path '*/.*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts tidak ada di dalam zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          VER=$(grep -m1 'versionName' "$PROJECT_DIR/app/build.gradle.kts" | sed -E 's/.*"(.*)".*/\1/')
          NAME="GameBooster-v${VER}.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBooster-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
